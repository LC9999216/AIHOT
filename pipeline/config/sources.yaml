# Free Token Hunter — discovery sources and official-domain trust anchors
#
# Trust anchors are version-controlled and reviewed by hand. Imported URLs,
# search ranking, URL text, model output, TLS validity, and name similarity
# can NEVER create an anchor. LIKELY_OFFICIAL and THIRD_PARTY evidence never
# confirm a provider.

discovery:
  # GitHub repository search queries (TASK-005)
  github:
    queries:
      - "free llm api"
      - "free ai api key"
      - "free llm api tier"
      - "free ai api credit"
      - "free gpt api"
      - "free llm playground api"
    results_per_query: 10
    max_total_results: 50

  # Curated immutable source references (TASK-006)
  curated:
    sources:
      - name: awesome-free-ai-coding
        url: https://raw.githubusercontent.com/mvalentsev/awesome-free-ai-coding/main/README.md
        kind: readme
      - name: free-llm-api-hub
        url: https://raw.githubusercontent.com/pacocartones/free-llm-api-hub/main/data/providers.json
        kind: structured

  # Hacker News search (TASK-006)
  hackernews:
    base_url: https://hn.algolia.com/api/v1/search
    max_results: 20

  # Reddit public search JSON (remaining-work T5, 2026-09-21).
  # Credential-free public endpoint; observations only, never verification.
  reddit:
    enabled: true
    base_url: https://www.reddit.com/search.json
    max_results: 25
    # subreddit: null  # optionally narrow discovery to one subreddit

  # X (Twitter) official v2 recent search (remaining-work T5, 2026-09-21).
  # X has no official free search API: without X_BEARER_TOKEN the adapter
  # stays disabled and contributes zero observations.
  x:
    base_url: https://api.twitter.com/2/tweets/search/recent
    max_results: 10

  # Web search (TASK-006); disabled without credentials
  web_search:
    enabled: false
    base_url: https://search.example/api

# Official-domain trust anchors (spec schema: provider_id, domains[],
# allow_subdomains, github_organizations[], github_repositories[], provenance,
# reviewed_at).
#
# NOTE: the pinned upstream import NEVER writes here. Anchors are only added by
# the project maintainers after manual review. Only anchored evidence may be
# OFFICIAL; LIKELY_OFFICIAL/THIRD_PARTY never confirm a provider.
trust_anchors:
  - provider_id: google-gemini
    domains: [ai.google.dev, cloud.google.com]
    allow_subdomains: true
    provenance: "manual review of ai.google.dev (Gemini API docs), 2026-09-01"
    reviewed_at: "2026-09-01"
  - provider_id: groq
    domains: [groq.com]
    allow_subdomains: true
    github_organizations: [groq]
    provenance: "manual review of console.groq.com docs, 2026-09-01"
    reviewed_at: "2026-09-01"
