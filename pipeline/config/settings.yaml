# Free Token Hunter — general settings
project: free-token-hunter
stage: one

paths:
  data_dir: data

# Discovery
discovery:
  max_pages_per_provider_per_run: 6
  max_redirects: 3
  max_response_bytes: 2097152      # 2 MiB
  total_request_timeout_seconds: 10
  allowed_schemes: [http, https]
  allowed_ports: [80, 443]
  accepted_content_types:
    - text/html
    - text/plain
    - application/json
    - application/xhtml+xml

# Evidence
evidence:
  confirmation_threshold: 80
  max_freshness_days: 90
  max_staleness_days: 180

# LLM extraction
llm:
  max_repair_attempts: 1
